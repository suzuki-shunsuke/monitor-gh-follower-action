name: test (workflow_call)
on: workflow_call
jobs:
  build:
    uses: ./.github/workflows/wc-build.yaml
    permissions: {}

  create-pr-branch:
    uses: ./.github/workflows/wc-create-pr-branch.yaml
    if: github.event.pull_request.user.login == 'suzuki-shunsuke'
    permissions:
      contents: write
      pull-requests: write
    with:
      pr: ${{github.event.pull_request.number}}

  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.65.2
    permissions:
      contents: read
      pull-requests: read
